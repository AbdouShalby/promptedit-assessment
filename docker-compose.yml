# Local development database only. Production uses the server's own Postgres (docs/deploy-vps.md).
name: promptedit

services:
    db:
        image: postgres:16
        environment:
            POSTGRES_DB: promptedit
            POSTGRES_USER: promptedit
            POSTGRES_PASSWORD: ${DB_PASSWORD:-promptedit}
        ports:
            - '127.0.0.1:55432:5432'
        volumes:
            - promptedit_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U promptedit -d promptedit']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    promptedit_pgdata:
